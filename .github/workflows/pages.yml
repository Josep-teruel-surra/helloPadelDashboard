name: Frontend en GitHub Pages

# Compila el frontend y lo publica en https://<usuario>.github.io/<repo>/.
# Requiere en Settings → Pages la fuente "GitHub Actions" y en Settings → Secrets and
# variables → Actions → Variables:
#   API_URL    URL pública del backend (https://…), sin /api al final. Obligatoria.
#   BASE_PATH  Opcional. Por defecto /<repo>/; pon "/" si usas un dominio propio.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: ${{ vars.API_URL }}
      VITE_BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que hay backend configurado
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Falta la variable API_URL (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      # GitHub Pages devuelve 404.html para cualquier ruta desconocida: así /correcciones/…
      # también carga la app al recargar o al abrir un enlace directo.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
