name: hellopadeldashboard

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hellopadel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hellopadel}
      POSTGRES_DB: ${POSTGRES_DB:-hellopadel}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hellopadel}:${POSTGRES_PASSWORD:-hellopadel}@db:5432/${POSTGRES_DB:-hellopadel}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hellopadel}:${POSTGRES_PASSWORD:-hellopadel}@db:5432/${POSTGRES_DB:-hellopadel}_test
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      # node_modules de la imagen (Linux), no los del host.
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  db_data:
